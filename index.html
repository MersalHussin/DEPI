<!DOCTYPE html>

  <head>

    <section class="flex__box" id="Flex box Tasks">

    <h1>inline Flex</h1>

        <div class="el el--1">Eng 1</div>

            </div>

            <div class="image-card">
                <img src="https://mersal.top/assets/Photos/Gallery/UI-UX/18.webp" alt="Nature">
